<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Binder Town · จับเวลาบอส 40 แนล</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600&display=swap">
<style>
:root{--bg:#0e1319;--pn:#161d27;--pn2:#1d2733;--ln:#2a3645;--tx:#e8edf3;--mu:#8795a8;--ok:#3ddc84;--wn:#ffb347;--hi:#5aa9ff;--f:#ff7a6b;--m:#c28bff;--e:#52c7e8;color-scheme:dark}
@media(prefers-color-scheme:light){:root{--bg:#f2f5f9;--pn:#fff;--pn2:#eaf0f6;--ln:#cfd8e3;--tx:#18222e;--mu:#586679;--ok:#12874a;--wn:#b36200;--hi:#1c68c4;--f:#d1402f;--m:#8a45d6;--e:#0a84a8;color-scheme:light}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 "Noto Sans Thai",system-ui,sans-serif;display:flex;flex-direction:column}
header{padding:10px 14px;border-bottom:1px solid var(--ln);background:var(--pn);display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
h1{font-size:17px;margin:0;font-weight:600}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1px solid var(--ln);background:var(--pn2);color:var(--tx);border-radius:999px;padding:4px 12px;cursor:pointer;font:inherit}
.chip[aria-pressed=true]{background:var(--hi);border-color:var(--hi);color:#fff}
input,button{font:inherit;color:var(--tx)}
input[type=search],input[type=number],input[type=time]{background:var(--pn2);border:1px solid var(--ln);border-radius:6px;padding:4px 8px}
input[type=search]{width:150px}
input[type=number]{width:64px}
.dur{display:flex;gap:6px;align-items:center;color:var(--mu);font-size:13px;flex-wrap:wrap}
.dur b{font-weight:600}
.dur .f{color:var(--f)}.dur .m{color:var(--m)}.dur .e{color:var(--e)}
#soon{padding:6px 14px;border-bottom:1px solid var(--ln);display:flex;gap:8px;overflow-x:auto;min-height:38px;align-items:center;background:var(--bg)}
#soon .it{flex:none;border:1px solid var(--ln);background:var(--pn);border-radius:6px;padding:3px 9px;cursor:pointer;display:flex;gap:7px;align-items:center;white-space:nowrap}
#soon .it img{width:22px;height:22px;object-fit:contain}
#soon .it.rd{border-color:var(--ok)}
#soon .empty{color:var(--mu)}
.t{font-variant-numeric:tabular-nums;font-weight:600}
.wrap{flex:1;overflow:auto;min-height:0}
table{border-collapse:separate;border-spacing:0}
th,td{border-bottom:1px solid var(--ln);border-right:1px solid var(--ln);text-align:center;padding:0}
thead th{position:sticky;top:0;background:var(--pn);z-index:2;height:34px;min-width:84px;font-weight:600}
thead th small{display:block;color:var(--mu);font-weight:400;font-size:11px;line-height:1}
.nm{position:sticky;left:0;z-index:1;background:var(--pn);text-align:left;min-width:210px;max-width:210px;padding:5px 10px;border-left:4px solid var(--ln)}
thead th.nm{z-index:3}
.nm div{display:flex;gap:9px;align-items:center}
.nm img{width:38px;height:38px;object-fit:contain;flex:none}
.nm span{display:block;line-height:1.2}
.nm small{color:var(--mu)}
.ph{width:38px;height:38px;flex:none;border-radius:6px;background:var(--pn2);display:grid;place-items:center;font-weight:600;color:var(--mu)}
#soon .ph{width:22px;height:22px;font-size:12px}
tr.f .nm{border-left-color:var(--f)}tr.m .nm{border-left-color:var(--m)}tr.e .nm{border-left-color:var(--e)}
tr.hide{display:none}
td{height:46px;min-width:84px;cursor:pointer;font-variant-numeric:tabular-nums;color:var(--mu)}
td:hover{background:var(--pn2)}
td.run{color:var(--tx);font-weight:600}
td.soon{background:color-mix(in srgb,var(--wn) 22%,transparent);color:var(--wn)}
td.ready{background:color-mix(in srgb,var(--ok) 22%,transparent);color:var(--ok);font-weight:600}
dialog{background:var(--pn);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:16px;width:min(340px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.55)}
dialog h2{margin:0 0 12px;font-size:16px}
dialog .r{display:flex;gap:8px;align-items:center;margin:10px 0}
dialog .r label{flex:1;color:var(--mu)}
.btn{border:1px solid var(--ln);background:var(--pn2);border-radius:6px;padding:6px 12px;cursor:pointer}
.btn.pri{background:var(--hi);border-color:var(--hi);color:#fff}
.btn.bad{color:var(--f)}
.ft{padding:6px 14px;color:var(--mu);font-size:12px;border-top:1px solid var(--ln)}
:focus-visible{outline:2px solid var(--hi);outline-offset:1px}
.wrap[hidden]{display:none}
#chs{position:sticky;top:0;z-index:2;background:var(--bg);padding:8px 14px;display:flex;gap:6px;overflow-x:auto;border-bottom:1px solid var(--ln)}
#chs button{flex:none;min-width:40px;position:relative}
#chs button i{position:absolute;top:3px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--ok)}
#cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;padding:14px}
.cd{background:var(--pn);border:2px solid var(--ln);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:9px}
.cd.hide{display:none}.cd.rd{border-color:var(--ok)}.cd.sn{border-color:var(--wn)}
.cd .top{display:flex;justify-content:space-between;align-items:center}
.cd .lv,.cd .st{font-size:12px;padding:1px 9px;border-radius:6px;background:var(--pn2);color:var(--mu)}
.cd.rd .st{color:var(--ok)}.cd.sn .st{color:var(--wn)}
.cd .id{display:flex;gap:10px;align-items:center}
.cd .id img,.cd .id .ph{width:54px;height:54px;object-fit:contain;flex:none}
.cd .id small{color:var(--wn)}
.cd .cave{font-size:12px;color:var(--mu);background:var(--bg);border-radius:8px;padding:6px 9px;line-height:1.5}
.cd .cave b{color:var(--tx);font-weight:600}
.cd .big{text-align:center;font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;padding:6px 0 2px}
.cd.rd .big{color:var(--ok)}.cd.sn .big{color:var(--wn)}
.cd .pb{height:5px;border-radius:3px;background:var(--pn2)}
.cd .pb i{display:block;height:100%;width:0;background:var(--hi);border-radius:3px}
.cd .tm{display:flex;justify-content:space-between;font-size:12px;color:var(--mu);font-variant-numeric:tabular-nums}
.cd .go{background:#df2a52;border:0;border-radius:8px;color:#fff;padding:9px;cursor:pointer;font-weight:600}
.cd .mn,.cd .ac{display:flex;gap:6px;align-items:center}
.cd .mn input{flex:1;min-width:0}
.cd .ac .cp{flex:1}
#clk{font-size:16px}
</style>
</head>
<body>
<header>
  <h1>Binder Town · จับเวลาบอส</h1>
  <div class="bar" id="vw"><button class="chip" data-v="cards" aria-pressed="true">การ์ด</button><button class="chip" data-v="table" aria-pressed="false">ตาราง 40 แนล</button></div>
  <div class="bar" id="flt">
    <button class="chip" data-f="all" aria-pressed="true">ทั้งหมด</button>
    <button class="chip" data-f="f" aria-pressed="false">Field Boss</button>
    <button class="chip" data-f="m" aria-pressed="false">Mini-boss</button>
    <input type="search" id="q" placeholder="ค้นหาชื่อบอส" aria-label="ค้นหาชื่อบอส">
  </div>
  <span class="t" id="clk"></span>
  <div class="dur">เวลาเกิดใหม่ (นาที):
    <b class="f">Field</b><input type="number" id="df" min="1">
    <b class="m">Mini</b><input type="number" id="dm" min="1">
    <button class="btn bad" id="clr">ล้างเวลาทั้งหมด</button>
  </div>
</header>
<div id="soon"></div>
<div class="wrap" id="cv"><div id="chs"></div><div id="cards"></div></div>
<div class="wrap" id="tw" hidden><table id="tb"></table></div>
<div class="ft">คลิกช่องเพื่อเริ่มนับ · ข้อมูลบันทึกในเบราว์เซอร์เครื่องนี้ · ข้อมูลบอสจาก wiki.bindertowngame.com</div>

<dialog id="dlg">
  <h2 id="dt"></h2>
  <div class="r"><button class="btn pri" id="now">เพิ่งตาย เริ่มนับเลย</button></div>
  <div class="r"><label for="at">ตายตอน</label><input type="time" id="at"><button class="btn" id="setAt">ตั้ง</button></div>
  <div class="r"><label for="left">เหลืออีก (นาที)</label><input type="number" id="left" min="0"><button class="btn" id="setLeft">ตั้ง</button></div>
  <div class="r"><button class="btn bad" id="clear">ล้างเวลา</button><button class="btn" id="close" style="margin-left:auto">ปิด</button></div>
</dialog>

<script>
const CH=40, BASE="https://wiki.bindertowngame.com/img/";
const L={
f:[["bloom_crowned_stag",25],["prism_shell_sovereign",25],["cinder_plume_roc",36],["lotus_maw_matriarch",40],["aurora_antler_regent",58],["tempest_kite_empress",70],["opal_weaver_queen",80],["vale_warden",99]],
m:[["vale_keeper",22],["dusk_herald",47],["sky_sentinel",72],["hullbreaker_kraken",104],["kite_drake",106],["coralback_tortoise",108],["fountain_serpent",110],["stationmaster_automaton",112],["forge_hermit",115]]
};
const TAG={f:"Field Boss",m:"Mini-boss"};
function fb(i){const s=document.createElement("span");s.className="ph";s.textContent=(i.dataset.n||"?")[0];i.replaceWith(s)}
const rows=[];
for(const t of ["f","m"])L[t].forEach(([s,lv],i)=>{
  const gen=s[0]==="*"; if(gen)s=s.slice(1);
  rows.push({id:t+i,t,s,lv,name:s.split("_").map(w=>w[0].toUpperCase()+w.slice(1)).join(" "),img:BASE+(gen?"gen/mob/":"mob/")+s+".png"});
});

let S={t:{},x:{},d:{f:180,m:180}};
try{const r=JSON.parse(localStorage.getItem("btb_v1"));if(r){S.t=r.t||{};S.x=r.x||{};Object.assign(S.d,r.d||{})}}catch(e){}
const save=()=>{try{localStorage.setItem("btb_v1",JSON.stringify(S))}catch(e){}};

const $=id=>document.getElementById(id), cells=new Map(), rowEls=new Map();
const tb=$("tb");
let h='<thead><tr><th class="nm">บอส</th>';
for(let c=1;c<=CH;c++)h+=`<th>CH${c}${c===10?"<small>PvP</small>":""}</th>`;
tb.innerHTML=h+"</tr></thead>";
const body=document.createElement("tbody");
for(const r of rows){
  const tr=document.createElement("tr");tr.className=r.t;
  const nm=document.createElement("th");nm.className="nm";nm.scope="row";
  nm.innerHTML=`<div><img src="${r.img}" alt="" data-n="${r.name}" referrerpolicy="no-referrer" onerror="fb(this)"><span><b>${r.name}</b><small>Lv ${r.lv} · ${TAG[r.t]}</small></span></div>`;
  tr.appendChild(nm);
  for(let c=1;c<=CH;c++){
    const td=document.createElement("td");td.dataset.k=r.id+"|"+c;
    cells.set(td.dataset.k,td);tr.appendChild(td);
  }
  rowEls.set(r.id,tr);body.appendChild(tr);
}
tb.appendChild(body);

const pad=n=>String(n).padStart(2,"0");
function fmt(ms){const s=Math.max(0,Math.ceil(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60);return(h?h+":":"")+pad(m)+":"+pad(s%60)}
function render(k,now){
  const td=cells.get(k),d=S.t[k];
  if(!d){td.className="";td.textContent="·";return}
  const rem=d-now;
  if(rem<=0){td.className="ready";td.textContent="เกิดแล้ว"}
  else{td.className=rem<=600000?"run soon":"run";td.textContent=fmt(rem)}
}
const rowOf=k=>rows.find(r=>r.id===k.split("|")[0]);
function soon(now){
  const ks=Object.keys(S.t);
  const up=ks.filter(k=>S.t[k]>now).sort((a,b)=>S.t[a]-S.t[b]).slice(0,7);
  const rd=ks.filter(k=>S.t[k]<=now).sort((a,b)=>S.t[b]-S.t[a]).slice(0,5);
  const el=$("soon");
  if(!up.length&&!rd.length){el.innerHTML='<span class="empty">ยังไม่มีบอสที่จับเวลา กดช่องในตารางเพื่อเริ่มนับ</span>';return}
  el.innerHTML=[...rd,...up].map(k=>{
    const r=rowOf(k),ch=k.split("|")[1],ready=S.t[k]<=now;
    return `<div class="it ${ready?"rd":""}" data-k="${k}"><img src="${r.img}" alt="" data-n="${r.name}" referrerpolicy="no-referrer" onerror="fb(this)"><span>${r.name} CH${ch}</span><span class="t" style="color:var(--${ready?"ok":"wn"})">${ready?"เกิดแล้ว":fmt(S.t[k]-now)}</span></div>`;
  }).join("");
}
function tick(){
  const now=Date.now();
  for(const k in S.t)render(k,now);
  soon(now);
  cardTick(now);
}
for(const k in S.t)if(!cells.has(k))delete S.t[k];
for(const k of cells.keys())render(k,Date.now());

const dlg=$("dlg");let cur=null;
function openDlg(k){
  cur=k;const r=rowOf(k);
  $("dt").textContent=r.name+" · CH"+k.split("|")[1];
  $("now").textContent="เพิ่งตาย เริ่มนับเลย ("+S.d[r.t]+" นาที)";
  $("at").value="";$("left").value="";
  dlg.showModal();
}
function setDeadline(ms,x){S.t[cur]=ms;if(x)S.x[cur]=x;else delete S.x[cur];save();render(cur,Date.now());tick();dlg.close()}
const dur=()=>S.d[rowOf(cur).t]*60000;
tb.addEventListener("click",e=>{const td=e.target.closest("td");if(td)openDlg(td.dataset.k)});
$("soon").addEventListener("click",e=>{
  const it=e.target.closest(".it");if(!it)return;
  const td=cells.get(it.dataset.k);
  if(!td.closest("tr").classList.contains("hide"))td.scrollIntoView({block:"center",inline:"center",behavior:"smooth"});
});
$("now").onclick=()=>setDeadline(Date.now()+dur(),Date.now());
$("setAt").onclick=()=>{
  const v=$("at").value;if(!v)return;
  const [hh,mm]=v.split(":").map(Number),d=new Date();
  d.setHours(hh,mm,0,0);if(d.getTime()>Date.now())d.setDate(d.getDate()-1);
  setDeadline(d.getTime()+dur());
};
$("setLeft").onclick=()=>{
  const v=$("left").value;if(v==="")return;
  setDeadline(Date.now()+Number(v)*60000);
};
$("clear").onclick=()=>{delete S.t[cur];delete S.x[cur];save();render(cur,Date.now());tick();dlg.close()};
$("close").onclick=()=>dlg.close();
$("clr").onclick=()=>{
  if(!confirm("ล้างเวลาที่จับไว้ทั้งหมด?"))return;
  S.t={};S.x={};save();for(const k of cells.keys())render(k,Date.now());tick();
};

for(const t of ["f","m"]){
  const el=$("d"+t);el.value=S.d[t];
  el.onchange=()=>{const v=Math.max(1,Number(el.value)||S.d[t]);S.d[t]=v;el.value=v;save();labAll()};
}

let flt="all";
function applyFilter(){
  const q=$("q").value.trim().toLowerCase();
  for(const r of rows){const h=!((flt==="all"||r.t===flt)&&r.name.toLowerCase().includes(q));rowEls.get(r.id).classList.toggle("hide",h);if(typeof cardEls!=="undefined")cardEls.find(e=>e._r===r).classList.toggle("hide",h)}
}
$("flt").addEventListener("click",e=>{
  const b=e.target.closest(".chip");if(!b)return;
  flt=b.dataset.f;
  $("flt").querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",c===b));
  applyFilter();
});
$("q").addEventListener("input",applyFilter);


const CAVE={bloom_crowned_stag:["Bloomcrown Glade","Whispering Woods (Lv 4–9)"],prism_shell_sovereign:["Ancient Ruins","Ancient Ruins"],cinder_plume_roc:["Cinder Eyrie","Ember Hollow (Lv 28–36)"],lotus_maw_matriarch:["Lotus Hollow","Mistmire Swamp (Lv 34–40)"],aurora_antler_regent:["Aurora Hollow","Frozen Mere (Lv 52–58)"],tempest_kite_empress:["Tempest Aerie","Cloudspire Ruins (Lv 64–70)"],opal_weaver_queen:["Opalweb Grotto","Shattered Vale (Lv 70–80)"],vale_warden:["Warden's Seat","Throne of the Warden (Lv 90–99)"]};
const fm=m=>m%60?m+" นาที":m/60+" ชม.";
const clk=ms=>{const d=new Date(ms);return pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds())};
const full=ms=>{const t=Math.max(0,Math.ceil(ms/1000));return pad(Math.floor(t/3600))+" : "+pad(Math.floor(t%3600/60))+" : "+pad(t%60)};
let ch=1;
const cardsEl=$("cards"),chs=$("chs");
chs.innerHTML=Array.from({length:CH},(_,i)=>`<button class="chip" data-c="${i+1}" aria-pressed="${i===0}">${i+1}<i hidden></i></button>`).join("");
const cardEls=rows.map(r=>{
  const el=document.createElement("div");el._r=r;el.className="cd";
  const cv=CAVE[r.s];
  el.innerHTML=`<div class="top"><span class="lv">Lv ${r.lv}</span><span class="st"></span></div><div class="id"><img src="${r.img}" alt="" data-n="${r.name}" referrerpolicy="no-referrer" onerror="fb(this)"><div><b>${r.name}</b><br><small class="tg"></small></div></div>${cv?`<div class="cave">ถ้ำ: <b>${cv[0]}</b><br>ทางเข้า: ${cv[1]}</div>`:""}<div class="big"></div><div class="pb"><i></i></div><div class="tm"><span class="d"></span><span class="s"></span></div><button class="go"></button><div class="mn"><input type="number" class="h" min="0" placeholder="ชม."><input type="number" class="m" min="0" placeholder="นาที"><button class="btn sm">เริ่มนับ</button></div><div class="ac"><button class="btn cp">คัดลอกเวลา</button><button class="btn rs">รีเซ็ต</button></div>`;
  el._q={st:el.querySelector(".st"),big:el.querySelector(".big"),pb:el.querySelector(".pb i"),d:el.querySelector(".d"),s:el.querySelector(".s"),go:el.querySelector(".go"),tg:el.querySelector(".tg")};
  cardsEl.appendChild(el);return el;
});
function labAll(){for(const e of cardEls){const m=S.d[e._r.t];e._q.go.textContent="เพิ่งตาย (ตอนนี้) → นับทันที "+fm(m);e._q.tg.textContent=TAG[e._r.t]+" ("+fm(m)+")"}}
labAll();
function cardTick(now){
  $("clk").textContent=clk(now);
  for(const e of cardEls){
    const r=e._r,k=r.id+"|"+ch,d=S.t[k],q=e._q,tot=S.d[r.t]*60000;
    if(!d){e.className="cd"+(e.classList.contains("hide")?" hide":"");q.st.textContent="ยังไม่มีข้อมูล";q.big.textContent="-- : -- : --";q.pb.style.width="0";q.d.textContent="ตาย: -";q.s.textContent="เกิด: -";continue}
    const rem=d-now,hid=e.classList.contains("hide")?" hide":"";
    e.className="cd"+(rem<=0?" rd":rem<=600000?" sn":"")+hid;
    q.st.textContent=rem<=0?"เกิดแล้ว (ALIVE)":"รอเกิด";
    q.big.textContent=rem<=0?"เกิดแล้ว !":full(rem);
    q.pb.style.width=(rem<=0?100:Math.min(100,Math.max(0,100-rem/tot*100)))+"%";
    q.d.textContent="ตาย: "+(S.x[k]?clk(S.x[k]):"-");q.s.textContent="เกิด: "+clk(d);
  }
  for(const b of chs.children){const c=b.dataset.c;b.lastChild.hidden=!rows.some(r=>{const v=S.t[r.id+"|"+c];return v&&v<=now})}
}
function put(k,ms,x){if(ms==null){delete S.t[k];delete S.x[k]}else{S.t[k]=ms;if(x)S.x[k]=x;else delete S.x[k]}save();render(k,Date.now());tick()}
cardsEl.addEventListener("click",ev=>{
  const e=ev.target.closest(".cd");if(!e)return;
  const r=e._r,k=r.id+"|"+ch,t=ev.target,now=Date.now();
  if(t.closest(".go"))put(k,now+S.d[r.t]*60000,now);
  else if(t.closest(".sm")){const m=(Number(e.querySelector(".h").value)||0)*60+(Number(e.querySelector(".m").value)||0);if(m>0){put(k,now+m*60000);e.querySelector(".h").value="";e.querySelector(".m").value=""}}
  else if(t.closest(".rs"))put(k,null);
  else if(t.closest(".cp")&&S.t[k]){try{navigator.clipboard.writeText(r.name+" CH"+ch+" เกิด "+clk(S.t[k]))}catch(x){}}
});
chs.addEventListener("click",ev=>{
  const b=ev.target.closest("button");if(!b)return;
  ch=+b.dataset.c;[...chs.children].forEach(x=>x.setAttribute("aria-pressed",x===b));tick();
});
$("vw").addEventListener("click",ev=>{
  const b=ev.target.closest(".chip");if(!b)return;
  [...$("vw").children].forEach(c=>c.setAttribute("aria-pressed",c===b));
  $("cv").hidden=b.dataset.v!=="cards";$("tw").hidden=b.dataset.v!=="table";
});

tick();setInterval(tick,1000);
</script>
</body>
</html>
